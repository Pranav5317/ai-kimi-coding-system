<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Dashboard UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3a0ca3;
            --success: #4cc9f0;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fb;
            color: var(--dark);
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 1rem 0;
            box-shadow: var(--box-shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .logo i {
            font-size: 1.8rem;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: var(--border-radius);
            transition: var(--transition);
        }

        nav a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .main-content {
            padding: 30px 0;
        }

        .section-title {
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--light-gray);
            color: var(--secondary);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 25px;
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--dark);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: #3a56d4;
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background-color: var(--primary);
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--light-gray);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .data-display {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 25px;
            margin-top: 20px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--light-gray);
        }

        .data-table th {
            background-color: var(--light);
            font-weight: 600;
            color: var(--dark);
        }

        .data-table tr:hover {
            background-color: rgba(67, 97, 238, 0.05);
        }

        .status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status-active {
            background-color: rgba(76, 201, 240, 0.2);
            color: #4cc9f0;
        }

        .status-inactive {
            background-color: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .status-pending {
            background-color: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        .stats-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            min-width: 200px;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin: 10px 0;
            color: var(--primary);
        }

        .stat-label {
            color: var(--gray);
            font-size: 0.9rem;
        }

        footer {
            background-color: var(--dark);
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
            }
            
            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .card-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-container {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 15px;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard Pro</span>
            </div>
            <nav>
                <ul>
                    <li><a href="#"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="#"><i class="fas fa-users"></i> Users</a></li>
                    <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
                    <li><a href="#"><i class="fas fa-question-circle"></i> Help</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container main-content">
        <h1 class="section-title">Dashboard Overview</h1>
        
        <div class="stats-container">
            <div class="stat-card">
                <i class="fas fa-users fa-2x"></i>
                <div class="stat-value" id="user-count">1,248</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-shopping-cart fa-2x"></i>
                <div class="stat-value" id="order-count">362</div>
                <div class="stat-label">Orders</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-dollar-sign fa-2x"></i>
                <div class="stat-value" id="revenue">$42,560</div>
                <div class="stat-label">Revenue</div>
            </div>
        </div>

        <div class="card-grid">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">User Registration</h2>
                    <button class="btn btn-outline"><i class="fas fa-sync"></i> Refresh</button>
                </div>
                <form id="user-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="role">Role</label>
                        <select id="role" class="form-control">
                            <option value="user">User</option>
                            <option value="admin">Administrator</option>
                            <option value="editor">Editor</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-user-plus"></i> Add User</button>
                </form>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Data Visualization</h2>
                    <button class="btn btn-outline" id="fetch-data-btn"><i class="fas fa-download"></i> Fetch Data</button>
                </div>
                <div class="form-group">
                    <label for="data-filter">Filter by Status</label>
                    <select id="data-filter" class="form-control">
                        <option value="all">All Statuses</option>
                        <option value="active">Active</option>
                        <option value="pending">Pending</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="search-input">Search Data</label>
                    <input type="text" id="search-input" class="form-control" placeholder="Search...">
                </div>
                <button class="btn btn-primary" id="search-btn"><i class="fas fa-search"></i> Search</button>
            </div>
        </div>

        <div class="data-display">
            <h2 class="section-title">Data Table</h2>
            <table class="data-table" id="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Last Active</th>
                    </tr>
                </thead>
                <tbody id="data-body">
                    <!-- Data will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2023 Dashboard Pro. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Sample data for demonstration
        const sampleData = [
            { id: 1, name: "John Smith", email: "john@example.com", role: "Administrator", status: "active", lastActive: "2023-06-15" },
            { id: 2, name: "Emily Johnson", email: "emily@example.com", role: "Editor", status: "pending", lastActive: "2023-06-14" },
            { id: 3, name: "Michael Brown", email: "michael@example.com", role: "User", status: "active", lastActive: "2023-06-12" },
            { id: 4, name: "Sarah Davis", email: "sarah@example.com", role: "Editor", status: "inactive", lastActive: "2023-06-10" },
            { id: 5, name: "Robert Wilson", email: "robert@example.com", role: "User", status: "active", lastActive: "2023-06-08" }
        ];

        // DOM Elements
        const dataBody = document.getElementById('data-body');
        const fetchDataBtn = document.getElementById('fetch-data-btn');
        const userForm = document.getElementById('user-form');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const dataFilter = document.getElementById('data-filter');

        // Initialize with sample data
        function renderData(data) {
            dataBody.innerHTML = '';
            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.name}</td>
                    <td>${item.email}</td>
                    <td>${item.role}</td>
                    <td><span class="status status-${item.status}">${item.status.charAt(0).toUpperCase() + item.status.slice(1)}</span></td>
                    <td>${item.lastActive}</td>
                `;
                dataBody.appendChild(row);
            });
        }

        // Fetch data from API (simulated)
        fetchDataBtn.addEventListener('click', function() {
            this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            
            setTimeout(() => {
                renderData(sampleData);
                this.innerHTML = '<i class="fas fa-download"></i> Fetch Data';
                
                // Update stats
                document.getElementById('user-count').textContent = sampleData.length;
                document.getElementById('order-count').textContent = Math.floor(Math.random() * 500) + 200;
                document.getElementById('revenue').textContent = '$' + (Math.random() * 100000).toFixed(0);
            }, 1000);
        });

        // Handle form submission
        userForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const role = document.getElementById('role').value;
            
            if (name && email) {
                alert(`User ${name} added successfully!`);
                userForm.reset();
            }
        });

        // Search functionality
        searchBtn.addEventListener('click', function() {
            const searchTerm = searchInput.value.toLowerCase();
            const rows = dataBody.querySelectorAll('tr');
            
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            });
        });

        // Filter functionality
        dataFilter.addEventListener('change', function() {
            const filterValue = this.value;
            const rows = dataBody.querySelectorAll('tr');
            
            rows.forEach(row => {
                const statusCell = row.querySelector('.status');
                if (filterValue === 'all' || 
                    (filterValue === 'active' && statusCell.classList.contains('status-active')) ||
                    (filterValue === 'pending' && statusCell.classList.contains('status-pending')) ||
                    (filterValue === 'inactive' && statusCell.classList.contains('status-inactive'))) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        });

        // Initialize with sample data
        renderData(sampleData);
    </script>
</body>
</html>
